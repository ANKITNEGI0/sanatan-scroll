<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ScrollVerse, a verse feed for the Gita, Ramayana, Mahabharata and Hanuman Chalisa. Read and listen in your browser, no app to install.">
<title>ScrollVerse</title>
<script>
/* Apply the stored theme before first paint, dark brown is the default.
   Mirrors client/src/lib/theme.ts in the space. */
try {
  if (localStorage.getItem("sanatan-scroll-theme") === "light") {
    document.documentElement.setAttribute("data-theme", "light");
  }
} catch (e) { /* storage unavailable, dark stays */ }
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">

  <!-- Top bar, ported from App.tsx: streak and language on the left,
       tagline in the middle, theme, sign-in and Pro on the right, and
       the text switcher on its own row below. One header only, no
       brand bar. -->
  <header class="topbar">
    <div class="topbar-inner">
      <nav class="textnav no-scrollbar" id="textBar" aria-label="Texts"></nav>
      <span class="streakpill" id="streakPill" aria-label="Day streak"></span>
      <div class="segmented" role="group" aria-label="Language" id="langToggle">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="hi" aria-pressed="false">हिं</button>
      </div>
      <p class="tagline font-verse" id="taglineEl"></p>
      <div class="segmented themetoggle" role="group" aria-label="Appearance" id="themeToggle">
        <button type="button" data-theme-choice="light" aria-label="Light mode" aria-pressed="false"></button>
        <button type="button" data-theme-choice="dark" aria-label="Dark mode" aria-pressed="true"></button>
      </div>
      <span id="authSlot" class="authslot"></span>
      <button type="button" class="propill" id="proBtn"></button>
    </div>
  </header>

  <div class="bodyrow">
    <!-- Desktop left rail: main nav + chapters of the current text -->
    <aside class="siderail" aria-label="Main">
      <nav class="railnav" id="railNav"></nav>
      <div class="railscroll railchapters">
        <p class="railhead" id="railHead"></p>
        <ul class="raillist" id="railList"></ul>
      </div>
    </aside>

    <!-- Main column -->
    <main class="maincol">
      <section id="feedView" class="feedview">
        <div id="specBar" class="specbar hidden"></div>
        <div class="feedwrap">
          <div class="progressbar"><div class="progressbar-fill" id="progressFill"></div></div>
          <div class="feed feed-scroll" id="feed" role="feed" aria-label="Verses"></div>
          <p class="feedcounter" id="feedCounter"></p>
        </div>
      </section>
      <section id="panelView" class="panelview rail-scroll hidden"></section>
    </main>

    <!-- Desktop right rail: verse of the day, streak, Pro -->
    <aside class="rightrail rail-scroll" id="rightRail"></aside>
  </div>

  <!-- Mobile bottom nav -->
  <nav class="bottomnav" id="bottomNav" aria-label="Main"></nav>
</div>

<div class="toast hidden" id="toast" role="status"><p id="toastText"></p></div>
<div id="sheetSlot"></div>
<div id="modalSlot"></div>

<script src="app.js"></script>
</body>
</html>
